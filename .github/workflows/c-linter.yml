name: C Linter

on:
  push:
    paths:
      - ".github/workflows/c-linter.yml"
      - "**/*.c"
      - "**/*.h"

  pull_request:
    branches:
      - "master"
    paths:
      - ".github/workflows/c-linter.yml"
      - "**/*.c"
      - "**/*.h"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  c-linter:
    name: C Linter
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-c-linter.yml@master

  generate-workflow-summary:
    name: Generate Workflow Summary
    needs:
      - c-linter
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-summary.yml@master

  generate-workflow-notifications:
    name: Generate Workflow Notifications
    needs:
      - generate-workflow-summary
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-notifier.yml@master
    with:
      notify_on_results: "failure,timed_out"
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
